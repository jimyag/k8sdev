kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: multiple-nodes
networking:
  apiServerAddress: "127.0.0.1"
  apiServerPort: 6443
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/12"
nodes:
  - role: control-plane
    image: kindest/node:v1.31.4
  - role: control-plane
    image: kindest/node:v1.31.4
  - role: control-plane
    image: kindest/node:v1.31.4
  - role: worker
    image: kindest/node:v1.31.4
    name: worker1
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
