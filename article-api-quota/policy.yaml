# 为实验 Namespace 中未声明资源的容器补默认值，同时设置单容器上限。
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 32Mi
      default:
        cpu: 200m
        memory: 64Mi
      max:
        cpu: "1"
        memory: 256Mi
---
# 最多准入两个非终态 Pod；CPU 与内存按声明值计入配额。
apiVersion: v1
kind: ResourceQuota
metadata:
  name: budget
spec:
  hard:
    pods: "2"
    requests.cpu: "1"
    requests.memory: 256Mi
    limits.cpu: "2"
    limits.memory: 512Mi
