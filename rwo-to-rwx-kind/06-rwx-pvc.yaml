# 转换后重新创建同名 PVC，复用同一个静态 PV 和同一个 NFS 后端路径。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rwo-rwx-disk
  namespace: rwo-rwx-test
spec:
  accessModes:
  # PVC 的访问模式不能原地修改，所以这里必须创建新对象。
  - ReadWriteMany
  volumeMode: Filesystem
  storageClassName: rwo-rwx-static
  volumeName: rwo-rwx-disk-pv
  resources:
    requests:
      storage: 1Gi
