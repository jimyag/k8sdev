# 基础工作负载：worker 接受 CPU 压力并由 HPA 调整；queue 固定单副本导出模拟队列总量。
# 仅用于独立的 kind-hpa-lab 集群，资源统一放在 hpa-demo 命名空间。
apiVersion: v1
kind: Namespace
metadata:
  name: hpa-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: hpa-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
      - name: worker
        image: hpa-demo:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        resources:
          requests:
            # 请求 0.1 个 CPU；CPU HPA 以目标容器的 request 作为利用率分母。
            cpu: 100m
            memory: 32Mi
          limits:
            # 把单容器 CPU 上限限制为 0.5 核，避免实验占满宿主机。
            cpu: 500m
            memory: 128Mi
        # 探针通过才计入 Ready；进阶实验会额外注入 60 秒就绪延迟。
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: worker
  namespace: hpa-demo
spec:
  selector:
    app: worker
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: queue
  namespace: hpa-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: queue
  template:
    metadata:
      labels:
        app: queue
    spec:
      containers:
      - name: queue
        image: hpa-demo:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        resources:
          requests:
            # 请求 0.1 个 CPU；CPU HPA 以目标容器的 request 作为利用率分母。
            cpu: 100m
            memory: 32Mi
          limits:
            # 把单容器 CPU 上限限制为 0.5 核，避免实验占满宿主机。
            cpu: 500m
            memory: 128Mi
        # 探针通过才计入 Ready；进阶实验会额外注入 60 秒就绪延迟。
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: queue
  namespace: hpa-demo
spec:
  selector:
    app: queue
  ports:
  - port: 8080
    targetPort: 8080
