# 百分比限速：允许窗口起点副本数的 100% 变化，不能简单理解为任意时刻的单次变化上限。
# 仅用于独立的 kind-hpa-lab 集群，资源统一放在 hpa-demo 命名空间。
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: worker
  namespace: hpa-demo
spec:
  # 真正被调整副本数的对象；它可以与指标关联的 Service 不同。
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: worker
  # 保留至少一个副本，本实验不验证缩到零。
  minReplicas: 1
  # 限制实验资源占用；达到上限不等于业务负载已满足目标。
  maxReplicas: 4
  metrics:
  - type: Object
    object:
      # 从这个 Kubernetes 对象读取指标，不会扩缩 Service 本身。
      describedObject:
        apiVersion: v1
        kind: Service
        name: queue
      metric:
        name: queue_depth
      target:
        type: AverageValue
        # 用总量除以每副本目标并向上取整；真实队列目标为 5，模拟队列目标为 10。
        averageValue: '10'
  behavior:
    scaleUp:
      # 关闭本方向的稳定窗口，以便单独观察速度限制。
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        # 统计近期扩缩变化的滚动窗口，不是固定执行周期。
        periodSeconds: 30
    scaleDown:
      # 关闭本方向的稳定窗口，以便单独观察速度限制。
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        # 统计近期扩缩变化的滚动窗口，不是固定执行周期。
        periodSeconds: 30
