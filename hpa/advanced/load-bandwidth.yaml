# 上传负载：每秒发送 35 个 1 MiB 请求体，目标为 35 MiB/s，实际速率由服务端核对。
# 仅用于独立的 kind-hpa-lab 集群，资源统一放在 hpa-demo 命名空间。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: http-load
  namespace: hpa-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: http-load
  template:
    metadata:
      labels:
        app: http-load
    spec:
      # 负载进程收到 SIGTERM 即停止；它不执行队列任务。
      terminationGracePeriodSeconds: 10
      containers:
      - name: http-load
        image: hpa-advanced:v1
        imagePullPolicy: IfNotPresent
        args:
        - load
        ports:
        - containerPort: 8080
          name: http
        resources:
          requests:
            # 请求 0.1 个 CPU；CPU HPA 以目标容器的 request 作为利用率分母。
            cpu: 100m
            memory: 32Mi
          limits:
            # 把单容器 CPU 上限限制为 0.5 核，避免实验占满宿主机。
            cpu: 500m
            memory: 128Mi
        env:
        # 设置发送目标速率；负载程序关闭 keepalive，让不同连接经 Service 分配。
        - name: RPS
          value: '35'
        # 发送至程序内部的上传 API，实际读取后才累计处理字节。
        - name: TARGET
          value: http://web:8080/upload
        - name: PAYLOAD_BYTES
          value: '1048576'
