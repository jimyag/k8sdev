# Pods HPA：按每 Pod 平均请求速率扩缩 web；输入是 rate() 的结果，不是累计请求数。
# 仅用于独立的 kind-hpa-lab 集群，资源统一放在 hpa-demo 命名空间。
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web
  namespace: hpa-demo
spec:
  # 真正被调整副本数的对象；它可以与指标关联的 Service 不同。
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web
  # 保留至少一个副本，本实验不验证缩到零。
  minReplicas: 1
  # 限制实验资源占用；达到上限不等于业务负载已满足目标。
  maxReplicas: 4
  metrics:
  - type: Pods
    pods:
      metric:
        name: http_requests_per_second
      target:
        type: AverageValue
        # 每 Pod 目标为 10 次请求/秒。
        averageValue: '10'
  behavior:
    scaleDown:
      # 缩容时参考最近 30 秒的副本建议，过滤短暂低负载。
      stabilizationWindowSeconds: 30
