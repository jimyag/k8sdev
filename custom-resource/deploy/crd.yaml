# 定义 apps.demo.example.com/v1 下的 WebApp 自定义资源。
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: webapps.apps.demo.example.com
spec:
  group: apps.demo.example.com
  names:
    plural: webapps
    singular: webapp
    kind: WebApp
    shortNames:
      - wa
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - image
              properties:
                image:
                  type: string
                  minLength: 1
                  description: 要运行的容器镜像。
                replicas:
                  type: integer
                  format: int32
                  minimum: 1
                  maximum: 10
                  default: 1
                  description: 期望运行的副本数。
                port:
                  type: integer
                  format: int32
                  minimum: 1
                  maximum: 65535
                  default: 80
                  description: Service 和容器使用的 HTTP 端口。
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                readyReplicas:
                  type: integer
                  format: int64
                availableReplicas:
                  type: integer
                  format: int64
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Image
          type: string
          jsonPath: .spec.image
        - name: Desired
          type: integer
          jsonPath: .spec.replicas
        - name: Ready
          type: integer
          jsonPath: .status.readyReplicas
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
