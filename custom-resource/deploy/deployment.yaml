# 部署控制器本身；镜像由 setup.sh 构建并加载到 kind 节点。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-controller
  namespace: custom-resource-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: webapp-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: webapp-controller
    spec:
      serviceAccountName: webapp-controller
      containers:
        - name: controller
          image: custom-resource-controller:dev
          imagePullPolicy: IfNotPresent
