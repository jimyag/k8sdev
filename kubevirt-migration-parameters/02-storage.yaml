---
# 实验资源使用独立命名空间，方便整体清理。
apiVersion: v1
kind: Namespace
metadata:
  name: migration-parameters
  labels:
    migration-lab: "true"
---
# 主实验 VM 的源 RWO PVC。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: main-source
  namespace: migration-parameters
spec:
  accessModes:
  - ReadWriteOnce
  volumeMode: Filesystem
  storageClassName: migration-local
  volumeName: migration-main-source
  resources:
    requests:
      storage: 2Gi
---
# 主实验 VM 的目标 RWO PVC。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: main-target
  namespace: migration-parameters
spec:
  accessModes:
  - ReadWriteOnce
  volumeMode: Filesystem
  storageClassName: migration-local
  volumeName: migration-main-target
  resources:
    requests:
      storage: 2Gi
---
