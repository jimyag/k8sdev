# 本实验使用静态 local PV，明确把源、目标 RWO 卷固定到两个 worker。
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: migration-local
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: Immediate
reclaimPolicy: Retain
---
# 主实验 VM 的源 PV，只能在第一个 worker 挂载。
apiVersion: v1
kind: PersistentVolume
metadata:
  name: migration-main-source
spec:
  capacity:
    storage: 2Gi
  accessModes:
  - ReadWriteOnce
  volumeMode: Filesystem
  storageClassName: migration-local
  persistentVolumeReclaimPolicy: Retain
  local:
    path: /var/local/kubevirt-migration/main-source
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - kv-migration-params-worker
---
# 主实验 VM 的目标 PV，只能在第二个 worker 挂载。
apiVersion: v1
kind: PersistentVolume
metadata:
  name: migration-main-target
spec:
  capacity:
    storage: 2Gi
  accessModes:
  - ReadWriteOnce
  volumeMode: Filesystem
  storageClassName: migration-local
  persistentVolumeReclaimPolicy: Retain
  local:
    path: /var/local/kubevirt-migration/main-target
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - kv-migration-params-worker2
---
# 第一组并发实验的源 PV。
apiVersion: v1
