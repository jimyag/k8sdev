# 用 init container 等待一个外部前置条件；先创建本 Pod，再创建 Service。
apiVersion: v1
kind: Pod
metadata:
  name: init-container-wait-for-service
  labels:
    app: init-container-wait-for-service
spec:
  initContainers:
    - name: wait-for-dependency
      image: busybox:1.36.1 # 提供 nslookup，避免把诊断工具放进应用镜像。
      command:
        - sh
        - -c
        - |
          set -eu
          # Service 出现后，集群 DNS 才能解析这个名称。
          until nslookup init-container-dependency.default.svc.cluster.local; do
            echo "waiting for init-container-dependency"
            sleep 2
          done
      resources:
        requests:
          cpu: 10m
          memory: 8Mi
  containers:
    - name: app
      image: busybox:1.36.1
      command:
        - sh
        - -c
        - |
          echo "dependency is available"
          sleep 3600 # 依赖可解析后，应用容器才会启动。
