# 普通 init container 失败时，Pod restartPolicy=Always 会让 kubelet 持续重试。
apiVersion: v1
kind: Pod
metadata:
  name: init-container-failure-retry
spec:
  restartPolicy: Always # 默认值；init container 失败后按 OnFailure 语义重试。
  initContainers:
    - name: fail-on-purpose
      image: busybox:1.36.1
      command:
        - sh
        - -c
        - |
          echo "initialization failed; retrying"
          exit 1 # 非 0 退出码表示初始化失败。
      resources:
        requests:
          cpu: 10m
          memory: 8Mi
  containers:
    - name: app
      image: busybox:1.36.1
      command:
        - sh
        - -c
        - sleep 3600 # init container 成功前，这个应用容器不会启动。
