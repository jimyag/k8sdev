apiVersion: v1 # 使用 core/v1 API 创建隔离实验资源的命名空间。
kind: Namespace # 避免实验资源与其他工作负载混在一起。
metadata:
  name: service-path
---
apiVersion: v1 # 使用 ConfigMap 保存透明可读的回显服务源码。
kind: ConfigMap # 避免依赖无法从 registry.k8s.io 拉取的测试镜像。
metadata:
  name: source-ip-server
  namespace: service-path
data:
  server.py: | # 直接从 TCP 连接读取客户端地址，并同时返回当前 Pod 主机名。
    import os
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == "/clientip":
                body = f"{self.client_address[0]}:{self.client_address[1]}\n"
            elif self.path == "/hostname":
                body = f"{os.uname().nodename}\n"
            else:
                body = "use /clientip or /hostname\n"
            self.send_response(200)
            self.send_header("Content-Type", "text/plain; charset=utf-8")
            self.send_header("Content-Length", str(len(body.encode())))
            self.end_headers()
            self.wfile.write(body.encode())

        def log_message(self, format, *args):
            print(f"client={self.client_address[0]} path={self.path}", flush=True)

    ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1 # Deployment 使用稳定的 apps/v1 API。
kind: Deployment # 运行一个能返回客户端地址和主机名的 HTTP 后端。
metadata:
  name: source-ip-server
  namespace: service-path
spec:
  replicas: 1 # 只保留一个后端，便于区分本地 endpoint 和跨节点转发。
  selector:
    matchLabels:
      app.kubernetes.io/name: source-ip-server # 必须与 Pod 标签一致。
  template:
    metadata:
      labels:
        app.kubernetes.io/name: source-ip-server # Service 使用该标签选择后端。
    spec:
      nodeSelector:
        kubernetes.io/hostname: svc-iptables-worker # 固定到一个 worker，制造另一个无本地 endpoint 的节点。
      containers:
        - name: server
          image: python:3.13.7-alpine3.22 # 固定到实验验证过的 Python Alpine 版本。
          imagePullPolicy: IfNotPresent # 优先使用预先载入 kind 节点的镜像。
          command:
            - python # 使用标准库 HTTP 服务读取 TCP 客户端地址。
            - /opt/source-ip/server.py # 运行 ConfigMap 中的回显服务源码。
          ports:
            - name: http
              containerPort: 8080 # 声明后端实际监听的端口。
          readinessProbe:
            httpGet:
              path: /hostname # 只有 netexec 能正常响应时才进入 EndpointSlice。
              port: http
            periodSeconds: 2 # 缩短本地实验等待时间。
          volumeMounts:
            - name: server-source
              mountPath: /opt/source-ip # 以只读文件形式挂载回显服务源码。
              readOnly: true
      volumes:
        - name: server-source
          configMap:
            name: source-ip-server # 引用同一命名空间中的源码 ConfigMap。
---
apiVersion: v1 # Service 属于 core/v1 API。
kind: Service # 同时提供 ClusterIP 和 NodePort 入口。
metadata:
  name: source-ip
  namespace: service-path
spec:
  type: NodePort # 允许集群外的 Docker 客户端访问节点地址。
  externalTrafficPolicy: Cluster # 初始状态允许节点把外部流量转给任意 Ready endpoint。
  selector:
    app.kubernetes.io/name: source-ip-server # 选择上面的单个后端 Pod。
  ports:
    - name: http
      protocol: TCP # 实验只观察 TCP 连接的 NAT 与 conntrack 行为。
      port: 80 # ClusterIP 对外暴露的端口。
      targetPort: http # 转发到 Pod 的命名端口 8080。
      nodePort: 30080 # 固定端口，便于对两个节点执行相同请求。
