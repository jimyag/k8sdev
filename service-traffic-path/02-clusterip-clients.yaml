apiVersion: v1 # Pod 使用 core/v1 API。
kind: Pod # 创建与后端同节点的 ClusterIP 客户端。
metadata:
  name: client-local-node
  namespace: service-path
  labels:
    app.kubernetes.io/name: service-client # 仅用于识别实验客户端。
spec:
  restartPolicy: Never # 客户端只用于手工执行请求，不需要控制器重启。
  nodeSelector:
    kubernetes.io/hostname: svc-iptables-worker # 与后端位于同一个 worker。
  containers:
    - name: client
      image: python:3.13.7-alpine3.22 # 使用已载入 kind 节点的固定镜像版本。
      imagePullPolicy: IfNotPresent # 避免实验过程再次访问镜像仓库。
      command:
        - sleep # 保持容器运行，供 kubectl exec 发起请求。
        - "3600" # 留出足够时间完成所有观测。
---
apiVersion: v1 # Pod 使用 core/v1 API。
kind: Pod # 创建与后端跨节点的 ClusterIP 客户端。
metadata:
  name: client-remote-node
  namespace: service-path
  labels:
    app.kubernetes.io/name: service-client # 仅用于识别实验客户端。
spec:
  restartPolicy: Never # 客户端只用于手工执行请求，不需要控制器重启。
  nodeSelector:
    kubernetes.io/hostname: svc-iptables-worker2 # 与后端位于不同 worker。
  containers:
    - name: client
      image: python:3.13.7-alpine3.22 # 使用已载入 kind 节点的固定镜像版本。
      imagePullPolicy: IfNotPresent # 避免实验过程再次访问镜像仓库。
      command:
        - sleep # 保持容器运行，供 kubectl exec 发起请求。
        - "3600" # 留出足够时间完成所有观测。
