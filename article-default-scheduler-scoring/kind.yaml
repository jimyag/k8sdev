kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
# 使用同一补丁版本的上游控制面镜像；节点容器基底仍是 kindest/node:v1.37.0。
kubeadmConfigPatches:
  - |
    kind: ClusterConfiguration
    kubernetesVersion: v1.37.2
    scheduler:
      extraArgs:
        # 打印默认调度器最终乘过权重的每项插件分。
        - name: v
          value: "10"
nodes:
  - role: control-plane
  - role: worker
  - role: worker
