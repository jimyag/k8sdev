# 裸 Pod 没有控制器补副本；Never 策略让退出码直接决定终态。
apiVersion: v1
kind: Pod
metadata:
  name: completed
  namespace: lifecycle-lab
spec:
  restartPolicy: Never
  nodeSelector:
    kubernetes.io/hostname: pod-lifecycle-worker
  containers:
    - name: task
      image: python:3.12-alpine
      command: [sh, -c, 'exit 0']
---
apiVersion: v1
kind: Pod
metadata:
  name: failed
  namespace: lifecycle-lab
spec:
  restartPolicy: Never
  nodeSelector:
    kubernetes.io/hostname: pod-lifecycle-worker
  containers:
    - name: task
      image: python:3.12-alpine
      command: [sh, -c, 'exit 7']
