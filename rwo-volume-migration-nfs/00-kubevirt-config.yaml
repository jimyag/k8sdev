# Volume Migration 依赖 LiveMigrate 更新方式；先把配置合并到现有 KubeVirt CR。
apiVersion: kubevirt.io/v1
kind: KubeVirt
metadata:
  name: kubevirt
  namespace: kubevirt
spec:
  configuration:
    # 允许运行中的 VM 通过热更新应用新的卷集合。
    vmRolloutStrategy: LiveUpdate
  workloadUpdateStrategy:
    # VM 的卷引用变化由 Live Migration 流程处理。
    workloadUpdateMethods:
    - LiveMigrate
