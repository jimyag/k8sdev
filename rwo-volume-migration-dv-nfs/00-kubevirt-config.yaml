# Volume Migration 需要 KubeVirt 使用 LiveUpdate 和 LiveMigrate 处理 VM 更新。
apiVersion: kubevirt.io/v1
kind: KubeVirt
metadata:
  name: kubevirt
  namespace: kubevirt
spec:
  configuration:
    # 允许运行中的 VM 应用新的卷集合。
    vmRolloutStrategy: LiveUpdate
  workloadUpdateStrategy:
    # 卷引用变化交给 Live Migration 流程处理。
    workloadUpdateMethods:
    - LiveMigrate
