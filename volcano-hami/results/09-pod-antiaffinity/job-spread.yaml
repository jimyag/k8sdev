# 实际测试输入；已移除服务端生成的 metadata，便于复现。
# CPU 为核；vgpu-memory 每单位代表 100 MiB；cores 为百分比。
apiVersion: batch.volcano.sh/v1alpha1
kind: Job
metadata:
  name: spread
  namespace: volcano-tests
spec:
  schedulerName: volcano
  minAvailable: 2
  queue: lab
  tasks:
  - name: worker
    replicas: 2
    template:
      metadata:
        annotations: {}
        labels:
          app: spread-test
      spec:
        restartPolicy: Never
        terminationGracePeriodSeconds: 0
        containers:
        - name: work
          image: ubuntu:22.04
          imagePullPolicy: IfNotPresent
          command:
          - sleep
          - '3600'
          resources:
            requests:
              cpu: 100m
              memory: 32Mi
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: spread-test
              topologyKey: kubernetes.io/hostname
