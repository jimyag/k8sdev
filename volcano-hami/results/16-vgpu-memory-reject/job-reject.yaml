# 实际测试输入；已移除服务端生成的 metadata，便于复现。
# CPU 为核；vgpu-memory 每单位代表 100 MiB；cores 为百分比。
apiVersion: batch.volcano.sh/v1alpha1
kind: Job
metadata:
  name: reject
  namespace: volcano-tests
spec:
  schedulerName: volcano
  minAvailable: 1
  queue: lab
  tasks:
  - name: worker
    replicas: 1
    template:
      metadata:
        annotations: {}
      spec:
        restartPolicy: Never
        terminationGracePeriodSeconds: 0
        containers:
        - name: work
          image: ubuntu:22.04
          imagePullPolicy: IfNotPresent
          command:
          - sleep
          - '3600'
          resources:
            requests:
              cpu: 100m
              memory: 32Mi
            limits:
              volcano.sh/vgpu-number: 1
              volcano.sh/vgpu-memory: 500
              volcano.sh/vgpu-cores: 25
          volumeMounts:
          - name: cuda
            mountPath: /usr/lib/x86_64-linux-gnu/libcuda.so.1
            readOnly: true
        nodeSelector:
          kubernetes.io/hostname: volcano-lab-worker
        runtimeClassName: nvidia
        volumes:
        - name: cuda
          hostPath:
            path: /var/lib/nvml-mock/driver/usr/lib64/libcuda.so.1
            type: File
