# 实际测试输入；已移除服务端生成的 metadata，便于复现。
# CPU 为核；vgpu-memory 每单位代表 100 MiB；cores 为百分比。
apiVersion: flow.volcano.sh/v1alpha1
kind: JobTemplate
metadata:
  name: step-b
  namespace: volcano-tests
spec:
  schedulerName: volcano
  minAvailable: 1
  queue: lab
  tasks:
  - name: worker
    replicas: 1
    template:
      metadata:
        annotations: {}
      spec:
        restartPolicy: Never
        terminationGracePeriodSeconds: 0
        containers:
        - name: work
          image: ubuntu:22.04
          imagePullPolicy: IfNotPresent
          command:
          - sh
          - -c
          - sleep 2; echo finished
          resources:
            requests:
              cpu: 100m
              memory: 32Mi
