# 实际测试输入；已移除服务端生成的 metadata，便于复现。
# CPU 为核；vgpu-memory 每单位代表 100 MiB；cores 为百分比。
apiVersion: batch.volcano.sh/v1alpha1
kind: Job
metadata:
  name: tolerated
  namespace: volcano-tests
spec:
  schedulerName: volcano
  minAvailable: 1
  queue: lab
  tasks:
  - name: worker
    replicas: 1
    template:
      metadata:
        annotations: {}
      spec:
        restartPolicy: Never
        terminationGracePeriodSeconds: 0
        containers:
        - name: work
          image: ubuntu:22.04
          imagePullPolicy: IfNotPresent
          command:
          - sleep
          - '3600'
          resources:
            requests:
              cpu: 100m
              memory: 32Mi
        nodeSelector:
          kubernetes.io/hostname: volcano-lab-worker
        tolerations:
        - key: lab
          operator: Equal
          value: reserved
          effect: NoSchedule
