# 临时 pod 是 kubernetes 1.25 版本引入的一种新的 pod 类型，用于简化 pod 的创建和销毁

apiVersion: v1
kind: Pod
metadata:
  name: ephemeral-pod
  labels:
    name: ephemeral-pod
spec:
  containers:
    - name: container-1
      image: registry.k8s.io/pause:3.1
      resources:
        limits:
          memory: "128Mi"
          cpu: "500m"
      ports:
        - containerPort: 8080
  restartPolicy: Always
