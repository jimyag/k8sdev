# 可选反例：单节点只有 2 个设备，申请 3 个应保持 Pending 并显示 Insufficient example.com/fpga。
apiVersion: v1
kind: Pod
metadata:
  name: fpga-over-capacity
  namespace: default
spec:
  containers:
    - name: consumer
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      resources:
        requests:
          example.com/fpga: "3"
        limits:
          example.com/fpga: "3"
